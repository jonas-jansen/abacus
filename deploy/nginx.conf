# abacus: a static site. Hashed assets never change; pages always revalidate.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # redirects relative to the address the visitor used: behind a port mapping (8080 → 80)
    # nginx would otherwise send them to its own port 80
    absolute_redirect off;

    location / {
        # /mathe-bio/applets is served from …/applets/index.html directly, without a redirect
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
