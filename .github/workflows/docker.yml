# Builds the student version (release profile "students", site/releases.json) as a Docker
# image and publishes it as ghcr.io/<owner>/abacus. The uni server pulls it (deploy/compose.yaml).
# The beta with everything stays on GitHub Pages (pages.yml).
#
# Set in the repository (Settings → Secrets and variables → Actions → Variables):
#   UNI_BASE  the path on the uni server, e.g. /abacus/ (default /)
#   UNI_SITE  its origin, e.g. https://mathe.uni-hohenheim.de (optional)
name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # the same checks as for the beta: no image from a broken commit
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/abacus
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ABACUS_RELEASE=students
            ABACUS_BASE=${{ vars.UNI_BASE || '/' }}
            ABACUS_SITE=${{ vars.UNI_SITE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
