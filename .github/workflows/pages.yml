# Builds the site and publishes it on GitHub Pages at https://<user>.github.io/<repo>/.
# Runs on every push to main and every morning (release plan); tests and dependency rules
# must pass first.
name: Pages

on:
  push:
    branches: [main]
  # every morning, so release dates in site/freigabe.json take effect without a push
  # (03:30 UTC = 04:30/05:30 in Germany)
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          ABACUS_SITE: https://${{ github.repository_owner }}.github.io
          ABACUS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
