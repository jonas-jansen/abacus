# Builds the beta (everything, hidden items marked) and publishes it on GitHub Pages at
# https://<user>.github.io/<repo>/. The student version is the Docker image (docker.yml).
# Runs on every push to main; tests and dependency rules must pass first.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          # the beta for colleagues: everything, also what students don't see yet
          ABACUS_ALL: '1'
          ABACUS_SITE: https://${{ github.repository_owner }}.github.io
          ABACUS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
